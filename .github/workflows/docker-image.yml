name: Docker image

# Build hobbylabs/samba-ad-container, test it and push it to Docker Hub.
#
# | Event                 | Tests | Push | Docker Hub tags                         |
# | --------------------- | ----- | ---- | --------------------------------------- |
# | pull_request          | yes   | no   | -                                       |
# | push to master        | yes   | yes  | master, sha-<short sha>                 |
# | push tag vX.Y.Z       | yes   | yes  | X.Y.Z, X.Y, X (X >= 1), latest          |
# | workflow_dispatch     | yes   | yes  | same as the ref it runs on              |
#
# "latest" is only updated by release tags (not by pre-release tags like v2.0.0-rc.1).
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  Docker Hub user name
#   DOCKERHUB_TOKEN     Docker Hub access token with Read & Write scope

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: hobbylabs/samba-ad-container
  # Local tag of the image under test
  TEST_IMAGE_TAG: samba-ad-container:ci

jobs:
  unit-test:
    name: Unit tests (bats)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Run bats unit tests
        run: make test

  image:
    name: Build, smoke test and push
    needs: unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=auto
          tags: |
            type=raw,value=master,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      # Build once and load it into the local docker so that the smoke test can run it.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: pdc
          load: true
          tags: ${{ env.TEST_IMAGE_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: make smoke-test
        env:
          IMAGE: ${{ env.TEST_IMAGE_TAG }}
          SKIP_BUILD: '1'

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Every layer is taken from the build above (same builder), so the pushed image
      # is the one that passed the smoke test.
      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: pdc
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Pushed ${IMAGE}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
